server:
  port: 8081

spring:
  application:
    name: ms-identidad
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/nutrivida_identidad?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true

app:
  jwt:
    secreto: ${JWT_SECRET}
    access-minutos: 15
    refresh-dias: 7
