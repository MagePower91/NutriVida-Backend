# Igual que los demás servicios: credenciales y clave JWT desde variables de entorno (ver README).
server:
  port: 8084   # 8081 identidad · 8082 catálogo · 8083 órdenes · 8084 citas

spring:
  application:
    name: ms-citas
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/nutrivida_citas?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true

app:
  jwt:
    secreto: ${JWT_SECRET}
  servicios:
    catalogo-url: ${CATALOGO_URL:http://localhost:8082}
