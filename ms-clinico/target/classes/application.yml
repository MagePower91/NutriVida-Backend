# Igual que los demás servicios: credenciales y clave JWT desde variables de entorno (ver README).
server:
  port: 8085   # 8081 identidad · 8082 catálogo · 8083 órdenes · 8084 citas · 8085 clínico

spring:
  application:
    name: ms-clinico
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/nutrivida_clinico?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true

app:
  jwt:
    secreto: ${JWT_SECRET}
