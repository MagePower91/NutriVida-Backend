#//QuÃ© hace cada parte://
#//routes: si la ruta coincide con Path, la peticiÃ³n se reenvÃ­a a la uri indicada.//
#//StripPrefix=1: quita la primera parte de la ruta. Por ejemplo, /identidad/v3/api-docs llega a ms-identidad como /v3/api-docs.//
#//secreto: debe ser exactamente igual al de los otros dos servicios.//
#//La ruta de ordenes ya queda lista. Hasta que creemos ese servicio, si la llamas va a responder con un error.//



server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          routes:
            # ---------- APIs ----------
            - id: identidad
              uri: ${IDENTIDAD_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/usuarios/**
            - id: catalogo
              uri: ${CATALOGO_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/servicios/**,/api/v1/categorias/**
            - id: ordenes
              uri: ${ORDENES_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/carrito/**,/api/v1/ordenes/**
            - id: citas
              uri: ${CITAS_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/citas/**,/api/v1/nutricionistas/**
            - id: clinico
              uri: ${CLINICO_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/fichas/**
            # ---------- DocumentaciÃ³n Swagger de cada servicio ----------
            - id: identidad-docs
              uri: ${IDENTIDAD_URL:http://localhost:8081}
              predicates:
                - Path=/identidad/v3/api-docs
              filters:
                - StripPrefix=1
            - id: catalogo-docs
              uri: ${CATALOGO_URL:http://localhost:8082}
              predicates:
                - Path=/catalogo/v3/api-docs
              filters:
                - StripPrefix=1
            - id: ordenes-docs
              uri: ${ORDENES_URL:http://localhost:8083}
              predicates:
                - Path=/ordenes/v3/api-docs
              filters:
                - StripPrefix=1
            - id: citas-docs
              uri: ${CITAS_URL:http://localhost:8084}
              predicates:
                - Path=/citas/v3/api-docs
              filters:
                - StripPrefix=1
            - id: clinico-docs
              uri: ${CLINICO_URL:http://localhost:8085}
              predicates:
                - Path=/clinico/v3/api-docs
              filters:
                - StripPrefix=1

app:
  jwt:
    secreto: ${JWT_SECRET}
  cors:
    origenes: http://localhost:5173

springdoc:
  swagger-ui:
    urls:
      - name: ms-identidad
        url: /identidad/v3/api-docs
      - name: ms-catalogo
        url: /catalogo/v3/api-docs
      - name: ms-ordenes
        url: /ordenes/v3/api-docs
      - name: ms-citas
        url: /citas/v3/api-docs
      - name: ms-clinico
        url: /clinico/v3/api-docs

